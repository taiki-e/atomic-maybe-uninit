name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TEST_THREADS: 1
  RUSTDOCFLAGS: -D warnings
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  ATOMIC_MAYBE_UNINIT_DENY_WARNINGS: 1

defaults:
  run:
    shell: bash --noprofile --norc -CeEuxo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # tidy:
  #   uses: taiki-e/github-actions/.github/workflows/tidy.yml@e6a1170cbd07eb898017958967912976fce18f2d # 2026.7.3
  #   permissions:
  #     security-events: write # for github/codeql-action/*
  # codegen:
  #   needs: tidy
  #   uses: taiki-e/github-actions/.github/workflows/gen.yml@e6a1170cbd07eb898017958967912976fce18f2d # 2026.7.3
  #   permissions:
  #     contents: write # for creating branch for pr
  #   secrets:
  #     PR_TOKEN_APP_PRIVATE_KEY: ${{ secrets.PR_TOKEN_APP_PRIVATE_KEY }}
  # msrv:
  #   needs: tidy
  #   uses: taiki-e/github-actions/.github/workflows/rust-msrv.yml@e6a1170cbd07eb898017958967912976fce18f2d # 2026.7.3

  prepare:
    # needs: tidy
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: Prepare
        id: prepare
        run: printf 'test-matrix=%s\n' "$(jq -c . .github/workflows/test-matrix.json)" >>"${GITHUB_OUTPUT}"
    outputs:
      test-matrix: ${{ steps.prepare.outputs.test-matrix }}

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.test-matrix) }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    container: ${{ matrix.container && fromJSON(format('{{"image":"{0}","options":"--privileged"}}', matrix.container)) || '' }}
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: taiki-e/github-actions/free-device-space@e6a1170cbd07eb898017958967912976fce18f2d # 2026.7.3
        if: startsWith(matrix.target, 'hexagon')
      - run: apt-get -o Acquire::Retries=10 -qq update && apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends gcc libc6-dev
        if: matrix.container != ''
      # - run: sudo apt-get -o Acquire::Retries=10 -qq update && sudo apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends moreutils
      #   if: startsWith(matrix.os, 'ubuntu') || matrix.os == ''
      # - run: brew install moreutils
      #   if: startsWith(matrix.os, 'macos')
      # - run: C:/msys64/usr/bin/pacman -S --noconfirm moreutils
      #   if: startsWith(matrix.os, 'windows')
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          # 0.4.8 fails with at least nightly-2023-05-09 to nightly-2024-01-05
          tool: cargo-careful${{ (startsWith(matrix.rust, 'nightly-2023') || startsWith(matrix.rust, 'nightly-2024')) && '@0.4.7' || '' }}
          fallback: none
        if: startsWith(matrix.rust, 'nightly') && !(startsWith(matrix.os, 'ubuntu') && contains(matrix.os, '-arm'))
      - uses: taiki-e/cache-cargo-install-action@417450f3c33ee20393705369577571770643d4c7 # v3.0.7
        with:
          # 0.4.8 fails with at least nightly-2023-05-09 to nightly-2024-01-05
          tool: cargo-careful${{ (startsWith(matrix.rust, 'nightly-2023') || startsWith(matrix.rust, 'nightly-2024')) && '@0.4.7' || '' }}
        if: startsWith(matrix.rust, 'nightly') && startsWith(matrix.os, 'ubuntu') && contains(matrix.os, '-arm')
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: rust@${{ matrix.rust }},cargo-hack,cargo-minimal-versions
          fallback: none
      - id: prepare
        run: |
          if [[ -z "${TARGET}" ]]; then
            printf 'matrix.target must be set\n'
            exit 1
          fi
          host="$(rustc -vV | grep -E '^host:' | cut -d' ' -f2)"
          if [[ "${host}" != "${TARGET}" ]]; then
            printf 'TARGET=--target=%s\n' "${TARGET}" >>"${GITHUB_ENV}"
            printf 'target-not-host=true\n' >>"${GITHUB_OUTPUT}"
          fi
        env:
          TARGET: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
          runner: ${{ matrix.container && 'native' || '' }}
        if: steps.prepare.outputs.target-not-host == 'true' && !startsWith(matrix.target, 'csky-')
      # We use qemu-system instead of qemu-user because csky_cmpxchg (trap 2) support is broken:
      # https://github.com/williamhuang99/qemu/blob/csky-qemu-v3/linux-user/csky/cpu_loop.c#L111-L130
      # TODO: not yet supported in setup-cross-toolchain-action
      - name: Set up C-SKY toolchain
        run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          retry sudo apt-get -o Acquire::Retries=10 -qq update
          retry sudo apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends \
            e2fsprogs \
            libaio1 \
            libdaxctl1 \
            libgcrypt20 \
            libglib2.0-0 \
            libgnutls30 \
            libjpeg-turbo8 \
            liblzo2-2 \
            libndctl6 \
            libnuma1 \
            libpam0g \
            libpixman-1-0 \
            libpmem1 \
            libpng16-16 \
            libsasl2-2 \
            libseccomp2 \
            libsnappy1v5 \
            libudev1 \
            libvdeplug2

          target_lower="${TARGET//-/_}"
          target_lower="${target_lower//./_}"
          target_upper=$(tr '[:lower:]' '[:upper:]' <<<"${target_lower}")
          # https://github.com/taiki-e/rust-cross-toolchain/pkgs/container/rust-cross-toolchain
          retry docker create --name gcc-csky-linux-gnuabiv2 "ghcr.io/taiki-e/rust-cross-toolchain:${TARGET}-dev-amd64"
          docker cp -- "gcc-csky-linux-gnuabiv2:/${TARGET}" "${HOME}"/gcc-csky-linux-gnuabiv2
          docker rm -f -- gcc-csky-linux-gnuabiv2 >/dev/null
          printf '%s\n' "${HOME}"/gcc-csky-linux-gnuabiv2/bin >>"${GITHUB_PATH}"
          printf '%s\n' "CARGO_TARGET_${target_upper}_LINKER=csky-abiv2-linux-gcc" >>"${GITHUB_ENV}"
          case "${TARGET}" in
            *hf)
              artifact_job=1251564492
              image_sha256=2b1a00786e3a858337986c03fd36d5b649f46988cb668ff13976b91e34eb85d4
              rootfs_sha256=fa6a2a7b90c7e6d4f09a7926138597e150412a9064d3fbc9f539582cdc1e315c
              qemu_cpu=c860v
              qemu_smp=2
              flags=''
              ;;
            *)
              artifact_job=1251564457
              image_sha256=0840cac22524fe519d8908e995e79cb7a599c0fce76975db304788c0d03cabbb
              rootfs_sha256=2f2a80bb664219f8d2933246b5633d3c068254a1485c7569583a0cdc677b2d7c
              qemu_cpu=c810v
              qemu_smp=1
              # ldex/stex requires ck860*
              # TODO: remove once we implemented csky_cmpxchg (trap 2) support
              flags=' -C target-cpu=ck860'
              ;;
          esac

          image_dir="${RUNNER_TEMP}/csky-${qemu_cpu}"
          mkdir -p -- "${image_dir}"
          image_url="https://gitlab.com/c-sky/buildroot/-/jobs/${artifact_job}/artifacts/raw/output/images"
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 -o "${image_dir}/Image.xz" "${image_url}/Image.xz"
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 -o "${image_dir}/rootfs.ext2.xz" "${image_url}/rootfs.ext2.xz"
          sha256sum -c - >/dev/null <<EOF
          ${image_sha256} *${image_dir}/Image.xz
          ${rootfs_sha256} *${image_dir}/rootfs.ext2.xz
          EOF
          xz --decompress --keep -- "${image_dir}/Image.xz" "${image_dir}/rootfs.ext2.xz"

          debugfs -w -R 'mkdir /mnt/host' "${image_dir}/rootfs.ext2"
          debugfs -w -R "write ${GITHUB_WORKSPACE}/tools/qemu-system-csky-init.sh /init" "${image_dir}/rootfs.ext2"
          debugfs -w -R 'set_inode_field /init mode 0100755' "${image_dir}/rootfs.ext2"

          qemu_system="${HOME}/gcc-csky-linux-gnuabiv2/bin/qemu-system-cskyv2"
          "${qemu_system}" --version
          printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS}${flags}" >>"${GITHUB_ENV}"
          printf 'RUSTDOCFLAGS=%s\n' "${RUSTDOCFLAGS}${flags}" >>"${GITHUB_ENV}"
          printf '%s\n' "CARGO_TARGET_${target_upper}_RUNNER=${GITHUB_WORKSPACE}/tools/qemu-system-csky-runner.sh" >>"${GITHUB_ENV}"
          printf 'CSKY_QEMU_SYSTEM=%s\n' "${qemu_system}" >>"${GITHUB_ENV}"
          printf 'CSKY_KERNEL=%s\n' "${image_dir}/Image" >>"${GITHUB_ENV}"
          printf 'CSKY_ROOTFS=%s\n' "${image_dir}/rootfs.ext2" >>"${GITHUB_ENV}"
          printf 'CSKY_QEMU_CPU=%s\n' "${qemu_cpu}" >>"${GITHUB_ENV}"
          printf 'CSKY_QEMU_SMP=%s\n' "${qemu_smp}" >>"${GITHUB_ENV}"
          printf 'BUILD_STD=-Z''build-std\n' >>"${GITHUB_ENV}"
        env:
          TARGET: ${{ matrix.target }}
        if: startsWith(matrix.target, 'csky-')
      - run: |
          target_lower="${TARGET//-/_}"
          target_lower="${target_lower//./_}"
          target_upper=$(tr '[:lower:]' '[:upper:]' <<<"${target_lower}")
          flags=''
          if [[ "$(eval "printf '%s\n' \${CARGO_TARGET_${target_upper}_RUNNER:-}")" == *"qemu"* ]]; then
            flags+=" --cfg qemu"
          fi
          if [[ -n "${FLAGS}" ]]; then
            flags+=" ${FLAGS}"
          fi
          if [[ "${RUST}" == "nightly" ]]; then
            case "${TARGET}" in
              # TODO(macos): error: linker stderr: ld: ignoring duplicate libraries: '-lc', '-lm'
              # TODO(windows): error: linker stdout: C:\a\portable-atomic\portable-atomic\target\debug\deps\portable_atomic-6f0d7f05900c9263.exe : warning LNK4072: section count 101 exceeds max (96); image may not run
              *-darwin* | *-windows-*) ;;
              *) flags+=" -D linker_messages" ;;
            esac
          fi
          if [[ -n "${flags}" ]]; then
            printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS}${flags}" >>"${GITHUB_ENV}"
            printf 'RUSTDOCFLAGS=%s\n' "${RUSTDOCFLAGS}${flags}" >>"${GITHUB_ENV}"
          fi
        env:
          TARGET: ${{ matrix.target }}
          FLAGS: ${{ matrix.flags }}
          RUST: ${{ matrix.rust }}
      # Old LLVM bug: Undefined temporary symbol error when building std.
      - name: Workaround for old LLVM bug about MIPS32
        run: printf 'CARGO_PROFILE_DEV_OPT_LEVEL=1\n' >>"${GITHUB_ENV}"
        if: (startsWith(matrix.target, 'mips-') || startsWith(matrix.target, 'mipsel-')) && (startsWith(matrix.rust, 'nightly-2023') || startsWith(matrix.rust, 'nightly-2024') || startsWith(matrix.rust, 'nightly-2025-01') || startsWith(matrix.rust, 'nightly-2025-02'))
      - name: Workaround for rustc/LLVM bug about SPARC-V8+
        run: |
          case "${RUST}" in
            nightly-202[0-5]-* | nightly-2026-0[1-3]-*)
              # Workaround for "unknown architecture of input file `*/symbols.o' is incompatible with sparc:v8plus output",
              # fixed in https://github.com/rust-lang/rust/pull/153537.
              flags=' -C target-feature=-v8plus -C link-arg=-mv8plus'
              printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS}${flags}" >>"${GITHUB_ENV}"
              printf 'RUSTDOCFLAGS=%s\n' "${RUSTDOCFLAGS}${flags}" >>"${GITHUB_ENV}"
              ;;
          esac
          # Workaround for "rustc-LLVM ERROR: Unsupported instruction : <MCInst 11 <MCOperand Reg:174>>" with LLVM 20-23
          printf 'CARGO_PROFILE_RELEASE_OPT_LEVEL=0\n' >>"${GITHUB_ENV}"
        env:
          RUST: ${{ matrix.rust }}
        if: startsWith(matrix.target, 'sparc-')

      - run: tools/test.sh -vv ${TARGET:-} ${DOCTEST_XCOMPILE:-} ${BUILD_STD:-}
      # We test doctest only once with the default build conditions because doctest is slow.
      # src/tests has extended copies of doctest, so this will not reduce test coverage.

      # x86_64 +cmpxchg16b
      # macOS is skipped because it is +cmpxchg16b by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b
        if: startsWith(matrix.target, 'x86_64') && !contains(matrix.target, '-darwin')
      # x86_64 +cmpxchg16b (no avx detection)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_no_outline_atomics
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_no_outline_atomics
        if: startsWith(matrix.target, 'x86_64')
      # x86_64 +cmpxchg16b (no avx)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_test_detect_false
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_test_detect_false
        if: startsWith(matrix.target, 'x86_64')
      # x86_64 +cmpxchg16b,+avx
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b,+avx
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b,+avx
        if: startsWith(matrix.target, 'x86_64')
      # x86 -sse2
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=-sse2
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=-sse2
        if: startsWith(matrix.target, 'i686')
      # x86 -sse
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse
        if: startsWith(matrix.target, 'i686')
      # x86 -x87
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse --cfg atomic_maybe_uninit_test_prefer_cmpxchg8b_over_x87
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse --cfg atomic_maybe_uninit_test_prefer_cmpxchg8b_over_x87
        if: startsWith(matrix.target, 'i586') || startsWith(matrix.target, 'i686')
      # aarch64 +lse
      # macOS is skipped because it is +lse,+lse2,+rcpc by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64')) && !contains(matrix.target, '-darwin')
      # aarch64 +lse,+lse2,+rcpc
      # macOS is skipped because it is +lse,+lse2,+rcpc by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse,+lse2,+rcpc
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse,+lse2,+rcpc
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64')) && !contains(matrix.target, '-darwin')
      # aarch64 +lse2,+lse128,+rcpc
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse2,+lse128,+rcpc
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse2,+lse128,+rcpc
        # Only QEMU supports this, so skip other runners.
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64')) && !contains(matrix.target, '-darwin') && !contains(matrix.os, '-arm')
      # arm v8 little endian
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+v8
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+v8
        if: startsWith(matrix.target, 'armv7') || startsWith(matrix.target, 'thumbv7')
      # arm v7 big endian (BE-8)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv7-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV7_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV7_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v6 big endian (BE-8)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv6-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV6_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV6_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v5te big endian (BE-32)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv5te-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV5TE_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV5TE_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v4t big endian (BE-32)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv4t-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV4T_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV4T_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v6 legacy cp15_barrier
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_use_cp15_barrier
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_use_cp15_barrier
        if: matrix.target == 'arm-unknown-linux-gnueabi'
      # arm pre-v6 thumb
      - run: tools/test.sh -vv --tests ${TARGET:-} -Z build-std
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+thumb-mode
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+thumb-mode
        # "LLVM ERROR: underestimated function size" with old nightly
        if: startsWith(matrix.rust, 'nightly') && (matrix.target == 'armv5te-unknown-linux-gnueabi' || (matrix.target == 'armv4t-unknown-linux-gnueabi' && !startsWith(matrix.rust, 'nightly-2024') && !startsWith(matrix.rust, 'nightly-2025') && !startsWith(matrix.rust, 'nightly-2026-01'))) && !startsWith(matrix.rust, 'nightly-2023')
      # powerpc +msync
      - run: tools/test.sh -vv --tests ${TARGET:-} -Z build-std
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+msync
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+msync
        if: startsWith(matrix.rust, 'nightly') && startsWith(matrix.target, 'powerpc-')
      # powerpc64 pwr7
      # powerpc64- (big-endian) is skipped because it is pre-pwr8 by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=pwr7
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=pwr7
        if: startsWith(matrix.target, 'powerpc64le-')
      # powerpc64 pwr8
      # powerpc64le- (little-endian) is skipped because it is pwr8 by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=pwr8
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=pwr8
        if: startsWith(matrix.target, 'powerpc64-')
      # riscv +zabha,+zacas
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+zabha,+zacas
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+zabha,+zacas
        if: startsWith(matrix.target, 'riscv')
      # riscv zalrsc-based RMW ({32,64}-bit swap with Zalrsc without Zaamo)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_zalrsc_over_zaamo
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_zalrsc_over_zaamo
        if: startsWith(matrix.target, 'riscv')
      # riscv zacas-based sub-word RMW ({8,16}-bit swap/cas with Zacas without Zalrsc & Zabha)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+zacas --cfg atomic_maybe_uninit_test_prefer_zacas_over_zalrsc_for_sub_word
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+zacas --cfg atomic_maybe_uninit_test_prefer_zacas_over_zalrsc_for_sub_word
        if: startsWith(matrix.target, 'riscv')
      # riscv +zalasr
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+zalasr
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+zalasr
        # Support for Zalasr extension requires LLVM 22+.
        if: startsWith(matrix.target, 'riscv') && !startsWith(matrix.rust, 'nightly-2023') && !startsWith(matrix.rust, 'nightly-2024') && !startsWith(matrix.rust, 'nightly-2025') && !startsWith(matrix.rust, 'nightly-2026-01')
      # s390x z196 (arch9)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=z196
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=z196
        if: startsWith(matrix.target, 's390x')
      # loongarch64 v1.1
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lam-bh,+lamcas,+scq
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lam-bh,+lamcas,+scq
          QEMU_CPU: max
        if: startsWith(matrix.target, 'loongarch64') && !startsWith(matrix.rust, '1.7') && !startsWith(matrix.rust, 'nightly-2023')
      # loongarch64 test loongarch32 path
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_st_ll_sc_over_amswap
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_st_ll_sc_over_amswap
        if: startsWith(matrix.target, 'loongarch64')
      # sparc/sparc64 test v8 path
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_swap_over_cas
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_swap_over_cas
        if: startsWith(matrix.target, 'sparc')

      - run: cargo minimal-versions build --workspace --no-private --detach-path-deps=skip-exact --all-features ${TARGET:-} ${BUILD_STD:-}
      - run: cargo minimal-versions build --workspace --no-private --detach-path-deps=skip-exact --all-features ${TARGET:-} ${BUILD_STD:-} --direct

