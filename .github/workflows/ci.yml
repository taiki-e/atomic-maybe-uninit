name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TEST_THREADS: 1
  RUSTDOCFLAGS: -D warnings
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  ATOMIC_MAYBE_UNINIT_DENY_WARNINGS: 1

defaults:
  run:
    shell: bash --noprofile --norc -CeEuxo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tidy:
    uses: taiki-e/github-actions/.github/workflows/tidy.yml@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
    permissions:
      security-events: write # for github/codeql-action/*
  codeql:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/codeql.yml@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
    permissions:
      security-events: write # for github/codeql-action/*
    with:
      language: rust
  msrv:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/rust-msrv.yml@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23

  prepare:
    needs: tidy
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: Prepare
        id: prepare
        run: printf 'test-matrix=%s\n' "$(jq -c . .github/workflows/test-matrix.json)" >>"${GITHUB_OUTPUT}"
    outputs:
      test-matrix: ${{ steps.prepare.outputs.test-matrix }}

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.test-matrix) }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    container: ${{ matrix.container && fromJSON(format('{{"image":"{0}","options":"--privileged"}}', matrix.container)) || '' }}
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: taiki-e/github-actions/free-device-space@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
        if: startsWith(matrix.target, 'hexagon')
      - run: apt-get -o Acquire::Retries=10 -qq update && apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends gcc libc6-dev
        if: matrix.container != ''
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          # 0.4.8 fails with at least nightly-2023-05-09 to nightly-2024-01-05
          tool: cargo-careful${{ (startsWith(matrix.rust, 'nightly-2023') || startsWith(matrix.rust, 'nightly-2024')) && '@0.4.7' || '' }}
          fallback: none
        if: startsWith(matrix.rust, 'nightly') && !(startsWith(matrix.os, 'ubuntu') && contains(matrix.os, '-arm'))
      - uses: taiki-e/cache-cargo-install-action@417450f3c33ee20393705369577571770643d4c7 # v3.0.7
        with:
          # 0.4.8 fails with at least nightly-2023-05-09 to nightly-2024-01-05
          tool: cargo-careful${{ (startsWith(matrix.rust, 'nightly-2023') || startsWith(matrix.rust, 'nightly-2024')) && '@0.4.7' || '' }}
        if: startsWith(matrix.rust, 'nightly') && startsWith(matrix.os, 'ubuntu') && contains(matrix.os, '-arm')
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: rust@${{ matrix.rust }},cargo-hack,cargo-minimal-versions
          fallback: none
      - id: prepare
        run: |
          if [[ -z "${TARGET}" ]]; then
            printf 'matrix.target must be set\n'
            exit 1
          fi
          host="$(rustc -vV | grep -E '^host:' | cut -d' ' -f2)"
          if [[ "${host}" != "${TARGET}" ]]; then
            printf 'TARGET=--target=%s\n' "${TARGET}" >>"${GITHUB_ENV}"
            printf 'target-not-host=true\n' >>"${GITHUB_OUTPUT}"
          fi
        env:
          TARGET: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@0375eb1d01bea430aa3202965839a7092960a23b # v1.43.1
        with:
          target: ${{ matrix.target }}
          runner: ${{ matrix.container && 'native' || '' }}
        if: steps.prepare.outputs.target-not-host == 'true' && !startsWith(matrix.target, 'csky-') && matrix.target != 'x86_64-unknown-linux-gnux32'
      # Use qemu-system because the C-SKY qemu-user runner has a broken csky_cmpxchg
      # (trap 2) emulation, which also affects glibc:
      # https://github.com/XUANTIE-RV/qemu/blob/xuantie-qemu-9.0/linux-user/csky/cpu_loop.c#L112
      # TODO: not yet supported in setup-cross-toolchain-action
      - name: Set up C-SKY toolchain
        run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          retry sudo apt-get -o Acquire::Retries=10 -qq update
          retry sudo apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends \
            e2fsprogs \
            libaio1 \
            libdaxctl1 \
            libgcrypt20 \
            libglib2.0-0 \
            libgnutls30 \
            libjpeg-turbo8 \
            liblzo2-2 \
            libndctl6 \
            libnuma1 \
            libpam0g \
            libpixman-1-0 \
            libpmem1 \
            libpng16-16 \
            libsasl2-2 \
            libseccomp2 \
            libsnappy1v5 \
            libudev1 \
            libvdeplug2

          target_upper=$(tr '[:lower:].-' '[:upper:]__' <<<"${TARGET}")
          toolchain_dir="${HOME}/gcc-csky-linux-gnuabiv2"
          # https://github.com/taiki-e/rust-cross-toolchain/pkgs/container/rust-cross-toolchain
          retry docker create --name gcc-csky-linux-gnuabiv2 "ghcr.io/taiki-e/rust-cross-toolchain:${TARGET}-dev-amd64"
          docker cp -- "gcc-csky-linux-gnuabiv2:/${TARGET}" "${toolchain_dir}"
          docker rm -f -- gcc-csky-linux-gnuabiv2 >/dev/null
          printf '%s\n' "${toolchain_dir}/bin" >>"${GITHUB_PATH}"
          # https://github.com/c-sky/buildroot/releases/tag/v1.0.10.1
          artifact_job=1251564492
          image_sha256=2b1a00786e3a858337986c03fd36d5b649f46988cb668ff13976b91e34eb85d4
          rootfs_sha256=fa6a2a7b90c7e6d4f09a7926138597e150412a9064d3fbc9f539582cdc1e315c
          # +crt-static: Workaround for C-SKY QEMU bug
          flags=' -C target-feature=+crt-static'
          if [[ "${TARGET}" != *hf ]]; then
              # ldex/stex requires ck860*
              flags+=' -C target-cpu=ck860'
          fi

          image_dir="${RUNNER_TEMP}/csky"
          mkdir -p -- "${image_dir}"
          image_url="https://gitlab.com/c-sky/buildroot/-/jobs/${artifact_job}/artifacts/raw/output/images"
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 -o "${image_dir}/Image.xz" "${image_url}/Image.xz"
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 -o "${image_dir}/rootfs.ext2.xz" "${image_url}/rootfs.ext2.xz"
          sha256sum -c - >/dev/null <<EOF
          ${image_sha256} *${image_dir}/Image.xz
          ${rootfs_sha256} *${image_dir}/rootfs.ext2.xz
          EOF
          xz --decompress -- "${image_dir}/Image.xz" "${image_dir}/rootfs.ext2.xz"

          cat >"${image_dir}/init" <<'EOF'
          #!/bin/sh
          /bin/busybox mount -t proc proc /proc
          export CI=true
          export GITHUB_ACTIONS=true
          export RUST_BACKTRACE=1
          export RUST_TEST_THREADS=1

          status=1
          if /bin/busybox mount -t 9p -o trans=virtio,version=9p2000.L,msize=1048576 hostshare /mnt/host; then
            if /bin/busybox xargs -0 /mnt/host/test </mnt/host/args; then
              status=0
            else
              status=$?
            fi
          fi

          if [ "${status}" -eq 0 ]; then
            printf 'C-SKY tests finished successfully\n'
          else
            printf 'C-SKY tests failed with status %s\n' "${status}"
          fi

          while true; do
            /bin/busybox sleep 1
          done
          EOF
          debugfs -w -R 'mkdir /mnt/host' "${image_dir}/rootfs.ext2"
          debugfs -w -R "write ${image_dir}/init /init" "${image_dir}/rootfs.ext2"
          debugfs -w -R 'set_inode_field /init mode 0100755' "${image_dir}/rootfs.ext2"

          runner="${image_dir}/qemu-system-csky-runner.sh"
          cat >"${runner}" <<'EOF'
          #!/usr/bin/env bash
          set -CeEuo pipefail
          IFS=$'\n\t'
          trap -- 's=$?; printf >&2 "%s\n" "${0##*/}:${LINENO}: \`${BASH_COMMAND}\` exit with ${s}"; exit ${s}' ERR

          image_dir=$(dirname -- "$0")
          binary=$1
          shift

          tmp=$(mktemp -d)
          qemu_pid=''
          cleanup() {
            if [[ -n "${qemu_pid}" ]]; then
              kill -- "${qemu_pid}" 2>/dev/null || true
              wait "${qemu_pid}" 2>/dev/null || true
            fi
            rm -rf -- "${tmp:?}"
          }
          trap -- cleanup EXIT
          shared="${tmp}/shared"
          mkdir -- "${shared}"
          install -m 0755 -- "${binary}" "${shared}/test"
          if [[ $# -gt 0 ]]; then
            printf '%s\0' "$@"
          fi >"${shared}/args"

          log="${tmp}/qemu.log"
          TMPDIR="${tmp}" qemu-system-cskyv2 \
            -M virt \
            -cpu c860v \
            -smp 2 \
            -m 1G \
            -display none \
            -monitor none \
            -serial stdio \
            -no-user-config \
            -nic none \
            -kernel "${image_dir}/Image" \
            -append 'console=ttyS0,115200 rootwait root=/dev/vda rw init=/init panic=-1 quiet' \
            -drive "file=${image_dir}/rootfs.ext2,format=raw,id=hd0,snapshot=on" \
            -device virtio-blk-device,drive=hd0 \
            -fsdev "local,id=fsdev0,path=${shared},security_model=none" \
            -device virtio-9p-device,id=fs0,fsdev=fsdev0,mount_tag=hostshare \
            -no-reboot \
            >"${log}" 2>&1 &
          qemu_pid=$!
          for _ in {1..360}; do
            if grep -Eq 'C-SKY tests (finished successfully|failed with status)' "${log}"; then
              break
            fi
            if ! kill -0 -- "${qemu_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -- "${qemu_pid}" 2>/dev/null || true
          wait "${qemu_pid}" 2>/dev/null || true
          qemu_pid=''
          cat -- "${log}"
          grep -Fq 'C-SKY tests finished successfully' "${log}"
          EOF
          chmod 0755 "${runner}"

          "${toolchain_dir}/bin/qemu-system-cskyv2" --version
          cat >>"${GITHUB_ENV}" <<EOF
          RUSTFLAGS=${RUSTFLAGS}${flags}
          RUSTDOCFLAGS=${RUSTDOCFLAGS}${flags}
          CARGO_TARGET_${target_upper}_LINKER=csky-abiv2-linux-gcc
          CARGO_TARGET_${target_upper}_RUNNER=${runner}
          BUILD_STD=-Zbuild-std
          EOF
        env:
          TARGET: ${{ matrix.target }}
        if: startsWith(matrix.target, 'csky-')
      - name: Set up x32 toolchain
        run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          retry sudo apt-get -o Acquire::Retries=10 -qq update
          retry sudo apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends \
            busybox-static \
            cpio \
            gcc-x86-64-linux-gnux32 \
            libc6-dev-x32-cross \
            qemu-system-x86
          # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
          sudo tee -- /etc/udev/rules.d/99-kvm4all.rules <<<'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          image_dir="${RUNNER_TEMP}/x32"
          root="${image_dir}/root"
          mkdir -p -- "${root}"/{bin,dev,libx32,proc,tmp}
          chmod 1777 "${root}/tmp"
          sudo mknod -m 0600 "${root}/dev/console" c 5 1
          install -m 0755 -- /usr/x86_64-linux-gnux32/lib/*.so.* "${root}/libx32/"
          install -m 0755 -- "$(type -P busybox)" "${root}/bin/busybox"

          kernel="${image_dir}/linux"
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 \
            -o "${kernel}" \
            https://deb.debian.org/debian/dists/trixie/main/installer-amd64/20250803/images/netboot/debian-installer/amd64/linux
          sha256sum -c - >/dev/null <<<"123e30d376f800b70848505a1193d0fce03359052677ed4e068eb60231a4bb02 *${kernel}"

          cat >"${root}/init" <<'EOF'
          #!/bin/busybox sh
          /bin/busybox mount -t devtmpfs devtmpfs /dev
          /bin/busybox mount -t proc proc /proc
          export LD_LIBRARY_PATH=/libx32
          export CI=true
          export GITHUB_ACTIONS=true
          export RUST_BACKTRACE=1
          export RUST_TEST_THREADS=1

          if /bin/busybox xargs -0 /test </args; then
            printf 'x32 tests finished successfully\n'
          else
            printf 'x32 tests failed with status %s\n' "$?"
          fi
          /bin/busybox poweroff -f
          while true; do
            /bin/busybox sleep 1
          done
          EOF
          chmod 0755 "${root}/init"

          (
            cd -- "${root}"
            find . -print0 \
              | cpio --null --create --format=newc --owner=0:0 \
              | gzip -1 >"${image_dir}/initrd.gz"
          )

          runner="${image_dir}/qemu-system-x32-runner.sh"
          cat >"${runner}" <<'EOF'
          #!/usr/bin/env bash
          set -CeEuo pipefail
          image_dir=$(dirname -- "$0")
          binary=$1
          shift

          tmp=$(mktemp -d)
          trap -- 'rm -rf -- "${tmp:?}"' EXIT
          mkdir -- "${tmp}/payload"
          install -m 0755 -- "${binary}" "${tmp}/payload/test"
          if [[ $# -gt 0 ]]; then
            printf '%s\0' "$@"
          fi >"${tmp}/payload/args"

          # Linux accepts concatenated initramfs archives. Append this invocation's
          # test executable and arguments to the shared kernel-independent files.
          initrd="${tmp}/initrd.gz"
          {
            cat -- "${image_dir}/initrd.gz"
            (
              cd -- "${tmp}/payload"
              printf '%s\n' test args \
                | cpio --quiet --create --format=newc --owner=0:0 \
                | gzip -1
            )
          } >"${initrd}"

          log="${tmp}/qemu.log"
          timeout 6m qemu-system-x86_64 \
            -display none \
            -monitor none \
            -serial stdio \
            -accel kvm \
            -cpu host \
            -m 6G \
            -smp 2 \
            -no-user-config \
            -nic none \
            -kernel "${image_dir}/linux" \
            -initrd "${initrd}" \
            -append 'console=ttyS0 rdinit=/init syscall.x32=y random.trust_cpu=on panic=-1' \
            -no-reboot \
            | tee -- "${log}"
          grep -Eq '^x32 tests finished successfully[[:space:]]*$' "${log}"
          EOF
          chmod 0755 "${runner}"

          cat >>"${GITHUB_ENV}" <<EOF
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNUX32_LINKER=x86_64-linux-gnux32-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNUX32_RUNNER=${runner}
          EOF
        if: matrix.target == 'x86_64-unknown-linux-gnux32'
      - run: |
          target_lower="${TARGET//-/_}"
          target_lower="${target_lower//./_}"
          target_upper=$(tr '[:lower:]' '[:upper:]' <<<"${target_lower}")
          flags=''
          if [[ "$(eval "printf '%s\n' \${CARGO_TARGET_${target_upper}_RUNNER:-}")" == *"qemu"* ]]; then
            flags+=" --cfg qemu"
          fi
          if [[ -n "${FLAGS}" ]]; then
            flags+=" ${FLAGS}"
          fi
          if [[ "${RUST}" == "nightly" ]]; then
            case "${TARGET}" in
              # TODO(macos): error: linker stderr: ld: ignoring duplicate libraries: '-lc', '-lm'
              # TODO(windows): error: linker stdout: C:\a\portable-atomic\portable-atomic\target\debug\deps\portable_atomic-6f0d7f05900c9263.exe : warning LNK4072: section count 101 exceeds max (96); image may not run
              # TODO(csky): these jobs use ck860/ck860v, but the available sysroot libraries use ck810
              *-darwin* | *-windows-* | csky*) ;;
              *) flags+=" -D linker_messages" ;;
            esac
          fi
          if [[ -n "${flags}" ]]; then
            printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS}${flags}" >>"${GITHUB_ENV}"
            printf 'RUSTDOCFLAGS=%s\n' "${RUSTDOCFLAGS}${flags}" >>"${GITHUB_ENV}"
          fi
        env:
          TARGET: ${{ matrix.target }}
          FLAGS: ${{ matrix.flags }}
          RUST: ${{ matrix.rust }}
      # Old LLVM bug: Undefined temporary symbol error when building std.
      - name: Workaround for old LLVM bug about MIPS32
        run: printf 'CARGO_PROFILE_DEV_OPT_LEVEL=1\n' >>"${GITHUB_ENV}"
        if: (startsWith(matrix.target, 'mips-') || startsWith(matrix.target, 'mipsel-')) && (startsWith(matrix.rust, 'nightly-2023') || startsWith(matrix.rust, 'nightly-2024') || startsWith(matrix.rust, 'nightly-2025-01') || startsWith(matrix.rust, 'nightly-2025-02'))
      - name: Workaround for rustc/LLVM bug about SPARC-V8+
        run: |
          case "${RUST}" in
            nightly-202[0-5]-* | nightly-2026-0[1-3]-*)
              # Workaround for "unknown architecture of input file `*/symbols.o' is incompatible with sparc:v8plus output",
              # fixed in https://github.com/rust-lang/rust/pull/153537.
              flags=' -C target-feature=-v8plus -C link-arg=-mv8plus'
              printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS}${flags}" >>"${GITHUB_ENV}"
              printf 'RUSTDOCFLAGS=%s\n' "${RUSTDOCFLAGS}${flags}" >>"${GITHUB_ENV}"
              ;;
          esac
          # Workaround for "rustc-LLVM ERROR: Unsupported instruction : <MCInst 11 <MCOperand Reg:174>>" with LLVM 20-23
          printf 'CARGO_PROFILE_RELEASE_OPT_LEVEL=0\n' >>"${GITHUB_ENV}"
        env:
          RUST: ${{ matrix.rust }}
        if: startsWith(matrix.target, 'sparc-')

      - run: tools/test.sh -vv ${TARGET:-} ${DOCTEST_XCOMPILE:-} ${BUILD_STD:-}
      # We test doctest only once with the default build conditions because doctest is slow.
      # src/tests has extended copies of doctest, so this will not reduce test coverage.

      # x86_64 +cmpxchg16b
      # macOS is skipped because it is +cmpxchg16b by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b
        if: startsWith(matrix.target, 'x86_64') && !contains(matrix.target, '-darwin')
      # x86_64 +cmpxchg16b (no avx detection)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_no_outline_atomics
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_no_outline_atomics
        if: startsWith(matrix.target, 'x86_64')
      # x86_64 +cmpxchg16b (no avx)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_test_detect_false
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_test_detect_false
        if: startsWith(matrix.target, 'x86_64')
      # x86_64 +cmpxchg16b,+avx
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b,+avx
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b,+avx
        if: startsWith(matrix.target, 'x86_64')
      # x86 -sse2
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+sse
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+sse
        if: startsWith(matrix.target, 'i586')
      # x86 -sse
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse
        if: startsWith(matrix.target, 'i686')
      # x86 -x87
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse --cfg atomic_maybe_uninit_test_prefer_cmpxchg8b_over_x87
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse --cfg atomic_maybe_uninit_test_prefer_cmpxchg8b_over_x87
        if: startsWith(matrix.target, 'i586') || startsWith(matrix.target, 'i686')
      # aarch64 +lse
      # macOS is skipped because it is +lse,+lse2,+rcpc by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64')) && !contains(matrix.target, '-darwin')
      # aarch64 +lse,+lse2,+rcpc
      # macOS is skipped because it is +lse,+lse2,+rcpc by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse,+lse2,+rcpc
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse,+lse2,+rcpc
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64')) && !contains(matrix.target, '-darwin')
      # aarch64 +lse2,+lse128,+rcpc
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse2,+lse128,+rcpc
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse2,+lse128,+rcpc
        # Only QEMU supports this, so skip other runners.
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64')) && !contains(matrix.target, '-darwin') && !contains(matrix.os, '-arm')
      # arm v8 little endian
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+v8
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+v8
        if: startsWith(matrix.target, 'armv7') || startsWith(matrix.target, 'thumbv7')
      # arm v7 big endian (BE-8)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv7-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV7_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV7_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v6 big endian (BE-8)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv6-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV6_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV6_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v5te big endian (BE-32)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv5te-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV5TE_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV5TE_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v4t big endian (BE-32)
      # armeb-unknown-linux-gnueabi is v8 by default, use custom target instead
      - run: tools/test.sh -vv --tests --target armebv4t-unknown-linux-gnueabi -Z build-std
        env:
          CARGO_TARGET_ARMEBV4T_UNKNOWN_LINUX_GNUEABI_LINKER: armeb-unknown-linux-gnueabi-gcc
          CARGO_TARGET_ARMEBV4T_UNKNOWN_LINUX_GNUEABI_RUNNER: qemu-armeb
        if: startsWith(matrix.rust, 'nightly') && matrix.target == 'armeb-unknown-linux-gnueabi'
      # arm v6 legacy cp15_barrier
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_use_cp15_barrier
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_use_cp15_barrier
        if: matrix.target == 'arm-unknown-linux-gnueabi'
      # arm pre-v6 thumb
      # TODO: compiler_builtins bug that uses non-thumb1 instructions.
      # - run: tools/test.sh -vv --tests ${TARGET:-} -Z build-std
      #   env:
      #     RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+thumb-mode
      #     RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+thumb-mode
      #   # "LLVM ERROR: underestimated function size" with old nightly
      #   if: startsWith(matrix.rust, 'nightly') && (matrix.target == 'armv5te-unknown-linux-gnueabi' || (matrix.target == 'armv4t-unknown-linux-gnueabi' && !startsWith(matrix.rust, 'nightly-2024') && !startsWith(matrix.rust, 'nightly-2025') && !startsWith(matrix.rust, 'nightly-2026-01'))) && !startsWith(matrix.rust, 'nightly-2023')
      # powerpc +msync
      - run: tools/test.sh -vv --tests ${TARGET:-} -Z build-std
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+msync
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+msync
        if: startsWith(matrix.rust, 'nightly') && startsWith(matrix.target, 'powerpc-')
      # powerpc64 pwr7
      # powerpc64- (big-endian) is skipped because it is pre-pwr8 by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=pwr7
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=pwr7
        if: startsWith(matrix.target, 'powerpc64le-')
      # powerpc64 pwr8
      # powerpc64le- (little-endian) is skipped because it is pwr8 by default
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=pwr8
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=pwr8
        if: startsWith(matrix.target, 'powerpc64-')
      # riscv +zabha,+zacas
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+zabha,+zacas
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+zabha,+zacas
        if: startsWith(matrix.target, 'riscv')
      # riscv zalrsc-based RMW ({32,64}-bit swap with Zalrsc without Zaamo)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_zalrsc_over_zaamo
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_zalrsc_over_zaamo
        if: startsWith(matrix.target, 'riscv')
      # riscv zacas-based sub-word RMW ({8,16}-bit swap/cas with Zacas without Zalrsc & Zabha)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+zacas --cfg atomic_maybe_uninit_test_prefer_zacas_over_zalrsc_for_sub_word
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+zacas --cfg atomic_maybe_uninit_test_prefer_zacas_over_zalrsc_for_sub_word
        if: startsWith(matrix.target, 'riscv')
      # riscv +zalasr
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+zalasr
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+zalasr
        # Support for Zalasr extension requires LLVM 22+.
        if: startsWith(matrix.target, 'riscv') && !startsWith(matrix.rust, 'nightly-2023') && !startsWith(matrix.rust, 'nightly-2024') && !startsWith(matrix.rust, 'nightly-2025') && !startsWith(matrix.rust, 'nightly-2026-01')
      # s390x z196 (arch9)
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=z196
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=z196
        if: startsWith(matrix.target, 's390x')
      # loongarch64 v1.1
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lam-bh,+lamcas,+scq
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lam-bh,+lamcas,+scq
          QEMU_CPU: max
        if: startsWith(matrix.target, 'loongarch64') && !startsWith(matrix.rust, '1.7') && !startsWith(matrix.rust, 'nightly-2023')
      # loongarch64 test loongarch32 path
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_st_ll_sc_over_amswap
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_st_ll_sc_over_amswap
        if: startsWith(matrix.target, 'loongarch64')
      # sparc/sparc64 test v8 path
      - run: tools/test.sh -vv --tests ${TARGET:-} ${BUILD_STD:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_swap_over_cas
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_swap_over_cas
        if: startsWith(matrix.target, 'sparc')

      - run: cargo minimal-versions build --workspace --no-private --detach-path-deps=skip-exact --all-features ${TARGET:-} ${BUILD_STD:-}
      - run: cargo minimal-versions build --workspace --no-private --detach-path-deps=skip-exact --all-features ${TARGET:-} ${BUILD_STD:-} --direct

  build:
    name: build (${{ matrix.name || matrix.rust }})
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: '1.74' # LLVM 17 (oldest version that MaybeUninit register is supported)
          - rust: stable
          - rust: beta
          - rust: nightly-2023-08-24 # Rust 1.74, LLVM 17 (oldest version that MaybeUninit register is supported)
          - rust: nightly
          # Check that test suite can be built
          - name: nightly, --tests
            rust: nightly
            tests: 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: rust@${{ matrix.rust }},cargo-hack
          fallback: none
      - run: tools/build.sh
        env:
          TESTS: ${{ matrix.tests }}
          ALL_TARGETS_MUST_BE_AVAILABLE: ${{ matrix.rust == 'nightly' || '' }}

  no-std:
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        rust:
          - '1.74' # LLVM 17 (oldest version that MaybeUninit register is supported)
          # - '1.81' # LLVM 18
          # - '1.86' # LLVM 19
          # - '1.90' # LLVM 20
          # - '1.94' # LLVM 21
          # - '1.98' # LLVM 22
          - stable
          # - beta
          - nightly-2023-08-24 # Rust 1.74, LLVM 17 (oldest version that MaybeUninit register is supported)
          # - nightly-2024-07-31 # Rust 1.82, LLVM 18
          # - nightly-2025-02-17 # Rust 1.87, LLVM 19
          # - nightly-2025-08-06 # Rust 1.91, LLVM 20
          # - nightly-2026-01-28 # Rust 1.95, LLVM 21
          # - nightly-2026-08-05 # Rust 1.99, LLVM 22
          - nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: rust@${{ matrix.rust }}${{ matrix.rust == 'stable' && ',cargo-hack,espup' || '' }}${{ (startsWith(matrix.rust, 'nightly') && matrix.rust != 'nightly-2023-08-24' && matrix.rust != 'nightly-2024-07-31' && matrix.rust != 'nightly-2025-02-17') && ',bpf-linker' || '' }}
          fallback: none
      - run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          apt_packages=(
            device-tree-compiler
            libslirp0
          )
          if [[ "${RUST}" == "nightly"* ]]; then
            apt_packages+=(
              avr-libc
              gcc-avr
              gcc-m68k-linux-gnu
              libc6-dev-m68k-cross
              simavr
            )
            if [[ "${RUST}" != "nightly-2023-08-24" ]] && [[ "${RUST}" != "nightly-2025-08-06" ]]; then
              apt_packages+=(
                libnspr4
                mspdebug
              )
            fi
          fi
          retry sudo apt-get -o Acquire::Retries=10 -qq update
          retry sudo apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends "${apt_packages[@]}"
          (
            cd
            retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 https://github.com/taiki-e/riscv-isa-sim/releases/download/v1.1.0-76ced61/riscv-isa-sim-ubuntu-24.04.tar.xz \
              | tar xJf -
            retry docker create --name gcc-riscv64-linux-musl ghcr.io/taiki-e/rust-cross-toolchain:riscv64gc-unknown-linux-musl-dev
            docker cp -- gcc-riscv64-linux-musl:/riscv64gc-unknown-linux-musl gcc-riscv64-linux-musl
            docker rm -f -- gcc-riscv64-linux-musl >/dev/null
            rm -- gcc-riscv64-linux-musl/bin/qemu-*
          )
          printf '%s\n' "${HOME}"/riscv-isa-sim/bin >>"${GITHUB_PATH}"
          printf '%s\n' "${HOME}"/gcc-riscv64-linux-musl/bin >>"${GITHUB_PATH}"
          qemu_version=11.1.3-patched.0
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://github.com/taiki-e/qemu/releases/download/v${qemu_version}/qemu-system-x86_64-linux.tar.zst" \
            | tar xf - --zstd
          sudo cp -r -- qemu/. /usr/local/
          rm -rf -- ./qemu
          # Patched QEMU for LoongArch semihosting
          printf 'LOONGARCH_QEMU_BIN_DIR=/usr/local/bin\n' >>"${GITHUB_ENV}"
          if [[ "${RUST}" == "nightly"* ]]; then
            retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://github.com/taiki-e/qemu/releases/download/v${qemu_version}/qemu-user-x86_64-linux.tar.zst" \
              | tar xf - --zstd
            sudo mv -- qemu-user/bin/qemu-* /usr/local/bin/
            rm -rf -- ./qemu-user
            if [[ "${RUST}" != "nightly-2023-08-24" ]]; then
              mkdir -p -- "${HOME}"/{msp430-gcc,sparc-bcc-gcc,tsim}
              if [[ "${RUST}" != "nightly-2025-08-06" ]]; then
                # https://www.ti.com/tool/MSP430-GCC-OPENSOURCE
                retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 -o msp430-gcc.tar.bz2 https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-LlCjWuAbzH/9.3.1.2/msp430-gcc-9.3.1.11_linux64.tar.bz2
                sha256sum -c - >/dev/null <<<'b60851b61565e3ddd2193298a3fac5120c2402597174106cc5f8482b9e9986e6 *msp430-gcc.tar.bz2'
                tar xf msp430-gcc.tar.bz2 --strip-components 1 -C "${HOME}"/msp430-gcc
                rm -- msp430-gcc.tar.bz2
                printf '%s\n' "${HOME}"/msp430-gcc/bin >>"${GITHUB_PATH}"
              fi
              # https://download.gaisler.com/anonftp/bcc2/bin/
              bcc_version=2.3.1
              retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://download.gaisler.com/anonftp/bcc2/bin/bcc-${bcc_version}-gcc-sparc-linux64.tar.xz" \
                | tar xJf - --strip-components 1 -C "${HOME}"/sparc-bcc-gcc
              printf '%s\n' "${HOME}"/sparc-bcc-gcc/bin >>"${GITHUB_PATH}"
              # https://download.gaisler.com/products/TSIM3/bin/tsim-eval/
              tsim3_version=3.1.15
              retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://download.gaisler.com/products/TSIM3/bin/tsim-eval/tsim-eval-${tsim3_version}.tar.gz" \
                | tar xzf - --strip-components 1 -C "${HOME}"/tsim
              printf '%s\n' "${HOME}"/tsim/tsim/linux-x64 >>"${GITHUB_PATH}"
            fi
          elif [[ "${RUST}" == "stable" ]]; then
            retry espup install --targets esp32,esp32s2,esp32s3
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST: ${{ matrix.rust }}
      - run: tools/no-std.sh
        env:
          ALL_TARGETS_MUST_BE_AVAILABLE: ${{ matrix.rust == 'nightly' || '' }}
      - run: tools/build.sh +esp xtensa-esp32-none-elf xtensa-esp32s2-none-elf xtensa-esp32s3-none-elf
        if: matrix.rust == 'stable'
      - run: tools/build.sh +esp xtensa-esp32-none-elf xtensa-esp32s2-none-elf xtensa-esp32s3-none-elf
        env:
          TESTS: 1
        if: matrix.rust == 'stable'
      - run: tools/no-std.sh +esp xtensa-esp32-none-elf xtensa-esp32s2-none-elf xtensa-esp32s3-none-elf
        if: matrix.rust == 'stable'

  valgrind:
    name: valgrind (${{ matrix.target }})
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: i686-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04-arm
          # TODO: "unhandled instruction: 0x4508 0xD103" in atomic_sub in Arc::drop (as of Valgrind 3.26)
          # - target: thumbv7neon-unknown-linux-gnueabihf
          #   os: ubuntu-24.04-arm
          - target: powerpc64le-unknown-linux-gnu
            arch: ppc64le
          - target: riscv64gc-unknown-linux-gnu
            arch: riscv64
          - target: s390x-unknown-linux-gnu
            arch: s390x
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: rust@nightly
          fallback: none
      - run: |
          if [[ -z "${TARGET}" ]]; then
            printf 'matrix.target must be set\n'
            exit 1
          fi
          host="$(rustc -vV | grep -E '^host:' | cut -d' ' -f2)"
          if [[ "${host}" != "${TARGET}" ]]; then
            printf 'TARGET=--target=%s\n' "${TARGET}" >>"${GITHUB_ENV}"
          fi
          printf 'VALGRIND=%s\n' "${VALGRIND}" >>"${GITHUB_ENV}"
        env:
          TARGET: ${{ matrix.target }}
          VALGRIND: ${{ matrix.arch && 'valgrind-cross' || 'valgrind' }}
      - uses: taiki-e/setup-cross-toolchain-action@0375eb1d01bea430aa3202965839a7092960a23b # v1.43.1
        with:
          target: ${{ matrix.target }}
          runner: valgrind
      - uses: taiki-e/github-actions/setup-docker@af422d7af8ef63e0ea0d84510aff17254fef31c2 # 2026.11.23
        with:
          buildx: false
          qemu: ${{ matrix.arch }}
        if: matrix.arch != ''
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
      # x86_64 +cmpxchg16b
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_no_outline_atomics
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b --cfg atomic_maybe_uninit_no_outline_atomics
        if: startsWith(matrix.target, 'x86_64')
      # x86_64 +cmpxchg16b,+avx
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+cmpxchg16b,+avx
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+cmpxchg16b,+avx
        if: startsWith(matrix.target, 'x86_64')
      # x86 -sse2
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_sse_over_sse2
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_sse_over_sse2
        if: startsWith(matrix.target, 'i686')
      # x86 -sse
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse
        if: startsWith(matrix.target, 'i686')
      # x86 -x87
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse --cfg atomic_maybe_uninit_test_prefer_cmpxchg8b_over_x87
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_x87_over_sse --cfg atomic_maybe_uninit_test_prefer_cmpxchg8b_over_x87
        if: startsWith(matrix.target, 'i686')
      # aarch64 +lse
      # As of Valgrind 3.26, Valgrind supports atomic instructions of Armv8.0, Armv8.1 (FEAT_LSE), and Armv8.3 (FEAT_LRCPC).
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64'))
      # aarch64 +lse,+rcpc
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+lse,+rcpc
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+lse,+rcpc
        if: (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'arm64'))
      # arm v8 little endian
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-feature=+v8
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-feature=+v8
        if: startsWith(matrix.target, 'armv7') || startsWith(matrix.target, 'thumbv7')
      # arm v6 kuser_memory_barrier
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_kuser_memory_barrier
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_kuser_memory_barrier
        if: startsWith(matrix.target, 'armv7') || startsWith(matrix.target, 'thumbv7')
      # arm v6 cp15_barrier
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_use_cp15_barrier
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_use_cp15_barrier
        if: startsWith(matrix.target, 'armv7') || startsWith(matrix.target, 'thumbv7')
      # arm v5 kuser_cmpxchg+kuser_memory_barrier
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_kuser_cmpxchg
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_kuser_cmpxchg
        if: startsWith(matrix.target, 'armv7') || startsWith(matrix.target, 'thumbv7')
      # arm v4 kuser_cmpxchg+kuser_memory_barrier+bx
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} --cfg atomic_maybe_uninit_test_prefer_kuser_cmpxchg --cfg atomic_maybe_uninit_test_prefer_bx
          RUSTFLAGS: ${{ env.RUSTFLAGS }} --cfg atomic_maybe_uninit_test_prefer_kuser_cmpxchg --cfg atomic_maybe_uninit_test_prefer_bx
        if: startsWith(matrix.target, 'armv7') || startsWith(matrix.target, 'thumbv7')
      # powerpc64 pwr7
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=pwr7
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=pwr7
        if: startsWith(matrix.target, 'powerpc64le-')
      # s390x z196 (arch9)
      - run: tools/test.sh "${VALGRIND}" -vv ${TARGET:-}
        env:
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -C target-cpu=z196
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -C target-cpu=z196
        if: startsWith(matrix.target, 's390x')

  asm-test:
    needs: tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: rust@nightly+rust-src,espup
          fallback: none
      - run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          retry espup install --targets esp32
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo test --manifest-path tests/asm-test/Cargo.toml
      - run: cargo +esp test --manifest-path tests/asm-test/Cargo.toml
